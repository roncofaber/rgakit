[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgakit"
description = "RGA mass spectrum decomposition and library fitting"
authors = [
    {name = "roncofaber", email = "fabrice.roncoroni@gmail.com"}
]
license = "MIT"
keywords = ["rga", "mass spectrometry", "fitting", "synchrotron", "NIST"]
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "platformdirs>=2.5.0",
    "plotly>=5.0.0",
    "nistchempy",
    "dill",
    "pubchempy",
    "rdkit",
    "ase",
    "networkx",
]

[project.optional-dependencies]
search = ["hnswlib", "gensim>=4.1"]

[project.urls]
Repository  = "https://github.com/roncofaber/rgakit"
"Bug Tracker" = "https://github.com/roncofaber/rgakit/issues"
Changelog   = "https://github.com/roncofaber/rgakit/releases"

[tool.setuptools]
packages = ["rgakit", "rgakit.molecule", "rgakit.databases"]

[tool.setuptools.dynamic]
version = {attr = "rgakit.__version__"}
