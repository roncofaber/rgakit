# Publish rgakit to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publisher (OIDC) — no API tokens needed.
# One-time setup on PyPI:
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a new Trusted Publisher:
#        PyPI project name : rgakit
#        Owner             : roncofaber
#        Repository        : rgakit
#        Workflow filename : publish.yml
#        Environment name  : pypi
#   3. Create the 'pypi' Environment in GitHub:
#        Repo → Settings → Environments → New environment → "pypi"
#        (optionally add a required-reviewer protection rule)
#
# To release a new version:
#   1. Bump __version__ in rgakit/__init__.py
#   2. git commit -m "release v0.x.y" && git tag v0.x.y && git push --tags
#   3. On GitHub: Releases → Draft a new release → pick the tag → Publish
#      → this workflow runs automatically

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publisher

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
